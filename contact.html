<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Neil Todkar</title>
<meta name="description" content="Get in touch with Neil Todkar for research collaborations, speaking, and early-stage building.">
<meta name="theme-color" content="#f6f5f2">
<link rel="icon" href="assets/avatar.jpg" type="image/jpeg">
<script>(function(){try{var q=/[?&]theme=(dark|light)/.exec(location.search);var t=q?q[1]:localStorage.getItem('nt-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main style="min-height:80vh">
  <header class="page-head">
    <div class="glow" aria-hidden="true"></div>
    <div class="wrap" style="max-width:860px">
      <div class="hero-kicker" style="animation:fadeUp .7s var(--ease) both">
        <span class="pulse" aria-hidden="true"></span>
        <span class="kicker-text" id="avail"></span>
      </div>
      <h1 class="display">Let's <em>connect</em>.</h1>
      <p>Whether it is a research idea, a speaking opportunity, a startup, or help bringing a local business online: reach out. I read everything.</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="wrap" style="max-width:860px">
      <div class="contact-list" id="rows"></div>
      <div class="mono" style="margin-top:32px" id="based"></div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script>
window.renderPage = function (D) {
  var P = D.profile, esc = NT.esc;
  document.getElementById('avail').textContent = P.availability;
  document.getElementById('based').textContent = 'Based in ' + P.location;
  var mail = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
  var phone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2z"/></svg>';
  var li = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 2H3.6A1.6 1.6 0 0 0 2 3.6v16.8A1.6 1.6 0 0 0 3.6 22h16.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 20.4 2zM8 19H5V9h3zM6.5 7.7a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zM19 19h-3v-4.9c0-1.2 0-2.7-1.6-2.7s-1.9 1.3-1.9 2.6V19h-3V9h2.9v1.4a3.2 3.2 0 0 1 2.8-1.6c3 0 3.6 2 3.6 4.6z"/></svg>';
  var ax = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  var rows = [
    { icon: mail, label: 'Email', value: P.email, href: 'mailto:' + P.email, copy: true },
    { icon: phone, label: 'Phone', value: P.phone, href: 'tel:' + P.phoneHref },
    { icon: li, label: 'LinkedIn', value: 'linkedin.com/in/neiltodkar', href: P.linkedin, ext: true },
    { icon: ax, label: 'arXiv', value: 'The Transparency Trap', href: P.arxiv, ext: true },
  ];
  document.getElementById('rows').innerHTML = rows.map(function (r) {
    var right = r.copy
      ? '<button class="btn btn-ghost btn-sm" type="button" data-copy="' + esc(r.value) + '">Copy</button>'
      : '<span class="go" aria-hidden="true">&#8599;</span>';
    return '<a class="card contact-row" data-reveal href="' + esc(r.href) + '"' + (r.ext ? ' target="_blank" rel="noopener"' : '') + '>' +
      '<span class="icon">' + r.icon + '</span>' +
      '<span><span class="label">' + esc(r.label) + '</span><span class="value" style="display:block">' + esc(r.value) + '</span></span>' +
      right + '</a>';
  }).join('');
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      var v = b.getAttribute('data-copy');
      try { navigator.clipboard && navigator.clipboard.writeText(v); } catch (err) {}
      var old = b.textContent; b.textContent = 'Copied';
      setTimeout(function () { b.textContent = old; }, 1600);
    });
  });
};
</script>
<script src="site.js"></script>
</body>
</html>
